<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TikTok · Le 4 fasi di chi apre la bolletta · io ti consiglio</title>
<style>
@font-face{font-family:'PoppinsLocal';font-weight:500;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf') format('truetype');}
@font-face{font-family:'PoppinsLocal';font-weight:700;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf') format('truetype');}
html,body{margin:0;background:#0E2240}canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../strumenti/base.js"></script>
<script>
// Durata 17.5 s. Stile: ironico, con la lampadina del logo come personaggio.
const P = [{a:0},{a:2.6},{a:5.3},{a:8.0},{a:10.8},{a:13.4}];
const TXT = [null,
  {lab:'FASE 1', main:'Non la apro.'},
  {lab:'FASE 2', main:'La apro.'},
  {lab:'FASE 3', main:'«Sarà stato il forno.»'},
  {lab:'FASE 4', main:'Spengo tutto.'},
  {lab:'FASE 5', main:'Me la mandi.'}];
const DARK = '#050A14';
const phase = (t) => { for (let i = P.length - 1; i >= 0; i--) if (t >= P[i].a) return i; return 0; };
const end = (i) => i < P.length - 1 ? P[i + 1].a : 999;

function mascot(cx, cy, s, o) {
  bulb(cx, cy, s, o.fill, o.cap, o.stroke);
  ctx.save(); ctx.translate(cx - 50 * s, cy - 42 * s); ctx.scale(s, s);
  const ink = o.ink || NAVY;
  [-10.5, 10.5].forEach((dx, i) => {
    const ex = 50 + dx, ey = 38, r = 6.6;
    const ry = Math.max(0.5, r * o.open);
    ctx.fillStyle = WH; ctx.beginPath(); ctx.ellipse(ex, ey, r, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 0.9; ctx.stroke();
    if (o.open > 0.25) { ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(ex + o.px, ey + Math.max(-ry + 2.6, Math.min(ry - 2.6, o.py)), 2.9 * (o.pup || 1), 0, 7); ctx.fill(); }
    if (o.brows) { const b = o.brows[i]; ctx.strokeStyle = ink; ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ex - 6.5, ey - ry - 3.2 + b.dy + b.tilt); ctx.lineTo(ex + 6.5, ey - ry - 3.2 + b.dy - b.tilt); ctx.stroke(); }
  });
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 1.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const mx = 50, my = 54;
  ctx.beginPath();
  if (o.mouth === 'flat') { ctx.moveTo(mx - 6.5, my); ctx.lineTo(mx + 6.5, my); ctx.stroke(); }
  else if (o.mouth === 'o') { ctx.ellipse(mx, my + 1, 4.4, 6.2, 0, 0, 7); ctx.fill(); }
  else if (o.mouth === 'smile') { ctx.moveTo(mx - 9.5, my - 2.5); ctx.quadraticCurveTo(mx, my + 9, mx + 9.5, my - 2.5); ctx.stroke(); }
  else if (o.mouth === 'smirk') { ctx.moveTo(mx - 6, my + 1.5); ctx.quadraticCurveTo(mx + 1, my + 2.5, mx + 7, my - 2); ctx.stroke(); }
  else if (o.mouth === 'wavy') { ctx.moveTo(mx - 8, my); for (let k = 1; k <= 16; k++) ctx.lineTo(mx - 8 + k, my + 1.5 * Math.sin(k * 1.2)); ctx.stroke(); }
  ctx.restore();
}

function envelope(x, y, sc, rot, openP, alpha) {
  if (alpha <= 0) return;
  const w = 250, h = 164;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  // retro
  ctx.fillStyle = '#D9D4C5'; rr(-w / 2, -h / 2, w, h, 16); ctx.fill();
  // foglio che esce
  if (openP > 0) {
    const pw = w * 0.8, ph = h * 1.5, rise = openP * h * 1.15;
    ctx.save(); ctx.beginPath(); ctx.rect(-w, -h * 3, w * 2, h * 3 + h / 2 - 8); ctx.clip();
    ctx.fillStyle = WH; rr(-pw / 2, -h / 2 + 14 - rise, pw, ph, 10); ctx.fill();
    ctx.fillStyle = '#C9D2E0';
    for (let k = 0; k < 3; k++) { rr(-pw / 2 + 20, -h / 2 + 36 - rise + k * 24, pw - 40 - (k === 2 ? 50 : 0), 9, 4.5); ctx.fill(); }
    ctx.save(); font(54, 700); ctx.fillStyle = '#E5484D'; ctx.textAlign = 'center'; ctx.fillText('€ ? ? ?', 0, -h / 2 + 166 - rise); ctx.restore();
    ctx.restore();
  }
  // fronte
  ctx.fillStyle = '#F4F1E8';
  ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2 + 16); ctx.lineTo(0, 22); ctx.lineTo(w / 2, -h / 2 + 16); ctx.lineTo(w / 2, h / 2 - 16); ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - 16, h / 2); ctx.lineTo(-w / 2 + 16, h / 2); ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - 16); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#B9B29E'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-w / 2 + 4, -h / 2 + 18); ctx.lineTo(0, 22); ctx.lineTo(w / 2 - 4, -h / 2 + 18); ctx.stroke();
  // lembo chiuso
  if (openP <= 0) { ctx.fillStyle = '#E9E5D8'; ctx.beginPath(); ctx.moveTo(-w / 2 + 6, -h / 2 + 6); ctx.lineTo(0, 24); ctx.lineTo(w / 2 - 6, -h / 2 + 6); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

window.render = function (t) {
  const i = phase(t), lt = t - P[i].a, b = end(i);
  // buio nella fase 4
  let dark = 0;
  if (i === 4) dark = eo(lt / 0.18);
  if (i === 5) dark = 1 - eo(lt / 0.25);
  ctx.globalAlpha = 1; ctx.fillStyle = mix(NAVY, DARK, dark); ctx.fillRect(0, 0, W, H);

  // filo: una lampadina in più a ogni fase, tutte spente al buio, tutte accese alla fine
  const on = [0, 1, 2, 3, 4].map(k => i === 5 ? eo((lt - 0.1 - k * 0.08) / 0.2) : (1 - dark) * eo((t - P[Math.min(k + 1, 5)].a - 0.3) / 0.2));
  wire(on, t, mix(YEL, '#2B3B5C', dark));

  // personaggio
  const p5 = i === 5 ? eo(lt / 0.6) : 0;
  let cx = lerp(440, 250, p5), cy = lerp(690, 670, p5) + 6 * Math.sin(2 * Math.PI * t / 2.2), s = lerp(8, 5.6, p5);
  s *= 1 + 0.05 * Math.sin(Math.PI * clamp(lt / 0.35)) * (i > 0 ? 1 : 0);
  const blink = (x) => 1 - Math.sin(Math.PI * clamp((x) / 0.16));
  const o = {fill: YEL, cap: WH, ink: NAVY, open: 1, px: 1.8, py: 0.8, mouth: 'flat'};
  if (i === 0) { o.open = blink(t - 1.5); }
  if (i === 1) { const g = clamp((lt - 1.3) / 0.12) - clamp((lt - 1.75) / 0.12); o.px = lerp(-2.4, 2.2, g); o.py = -0.4; o.mouth = 'wavy'; o.brows = [{dy: 0, tilt: -1.2}, {dy: 0, tilt: 1.2}]; }
  if (i === 2) { const g = eo((lt - 0.25) / 0.2); o.open = lerp(1, 1.5, g); o.pup = lerp(1, 0.62, g); o.px = 1.6; o.py = 0.6; o.mouth = g > 0.3 ? 'o' : 'flat'; cy -= 34 * Math.sin(Math.PI * clamp((lt - 0.25) / 0.4)); }
  if (i === 3) { o.open = 0.82; o.px = -1.8; o.py = -1.6; o.mouth = 'smirk'; o.brows = [{dy: 0.6, tilt: 0}, {dy: -3.4, tilt: -1.6}]; }
  if (i === 4) { o.fill = mix(YEL, '#131E33', dark); o.cap = mix(WH, '#2B3B5C', dark); o.stroke = '#2B3B5C'; o.ink = mix(NAVY, '#3A4C70', dark); o.px = 2.3 * Math.sin(2 * Math.PI * (lt - 0.3) / 2.1); o.py = 0; o.mouth = 'flat'; o.open = Math.min(blink(lt - 1.15), blink(lt - 2.0)); }
  if (i === 5) { o.px = 0; o.py = -1; o.mouth = 'smile'; o.open = blink(lt - 2.2); }
  if (i === 5) rays(cx, cy, 28 * s + 26, 34 * ebk((lt - 0.45) / 0.45), 7, 200, 340, 12, YEL, clamp((lt - 0.45) / 0.15));
  mascot(cx, cy, s, o);
  // goccia di sudore (fase 3)
  if (i === 3) { const d = clamp((lt - 0.5) / 1.6); const a = Math.sin(Math.PI * d); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#8FD3FF'; const dxp = cx + 150, dyp = cy - 190 + d * 90; ctx.beginPath(); ctx.moveTo(dxp, dyp - 34); ctx.bezierCurveTo(dxp + 26, dyp, dxp + 22, dyp + 26, dxp, dyp + 26); ctx.bezierCurveTo(dxp - 22, dyp + 26, dxp - 26, dyp, dxp, dyp - 34); ctx.fill(); ctx.restore(); } }

  // busta
  let ex = 800, ey = 840, esc = 1, erot = -0.06, eop = 0, ea = 1;
  if (i === 1) erot += 0.07 * Math.sin(2 * Math.PI * 7 * lt) * (0.4 + 0.6 * Math.sin(Math.PI * clamp(lt / 2.7)));
  if (i >= 2) eop = i === 2 ? ebk((lt - 0.2) / 0.45) : 1;
  if (i === 4) ea = 1 - 0.8 * dark;
  if (i === 5) { const q = ei(lt / 0.75); ex = lerp(800, 1180, q); ey = lerp(840, 380, q) - 120 * Math.sin(Math.PI * q); esc = lerp(1, 0.45, q); erot = lerp(-0.06, -0.5, q); ea = 1 - clamp((lt - 0.6) / 0.15); eop = 1 - eo(lt / 0.2); }
  envelope(ex, ey, esc, erot, eop, ea);

  // testi
  const out = b < 900 ? 1 - ei((t - (b - 0.25)) / 0.25) : 1;
  if (i === 0) {
    const z = Math.min(fit('Le 4 fasi di chi', 104, 700, 856), fit('apre la bolletta', 104, 700, 856));
    txt('Le 4 fasi di chi', 84, 1240, z, 700, WH, 'left', out);
    txt('apre la bolletta', 84, 1240 + z * 1.12, z, 700, YEL, 'left', out);
  } else if (i < 5) {
    const T = TXT[i], col = i === 4 ? mix(WH, '#C9D2E0', dark) : WH;
    const a1 = eo(lt / 0.3) * out, a2 = eo((lt - 0.1) / 0.4) * out;
    txt(T.lab, 84, 1200, 46, 700, i === 4 ? mix(YEL, '#8C7A3A', dark) : YEL, 'left', a1);
    const z = fit(T.main, 108, 700, 856);
    txt(T.main, 84, 1320 + (1 - eo((lt - 0.1) / 0.4)) * 46, z, 700, col, 'left', a2);
  } else {
    const T = TXT[5];
    logo(440, 676, 66, WH, eo((lt - 0.35) / 0.4));
    txt('La leggo io, gratis.', 440, 750, 44, 500, SUB, 'left', eo((lt - 0.5) / 0.4));
    txt(T.lab, 84, 1016, 46, 700, YEL, 'left', eo(lt / 0.3));
    txt(T.main, 84, 1124 + (1 - eo((lt - 0.1) / 0.4)) * 46, fit(T.main, 108, 700, 856), 700, WH, 'left', eo((lt - 0.1) / 0.4));
    band(eo((lt - 0.7) / 0.55), 1164);
  }
  if (i < 5) logo(84, 1420, 40, i === 4 ? mix(WH, '#5B6B86', dark) : WH, 1);
};
ready();
</script>
</body>
