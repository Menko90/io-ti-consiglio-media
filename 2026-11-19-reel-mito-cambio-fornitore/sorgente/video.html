<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Reel · Mito: se cambio fornitore resto senza luce? · io ti consiglio</title>
<style>
@font-face{font-family:'PoppinsLocal';font-weight:500;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf') format('truetype');}
@font-face{font-family:'PoppinsLocal';font-weight:700;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf') format('truetype');}
html,body{margin:0;background:#0E2240}canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../strumenti/base.js"></script>
<script>
// Durata 17.5 s. Stile: mito da sfatare. Fatto verificato su ARERA (Atlante del consumatore):
// il cambio venditore non comporta interruzioni del servizio né interventi tecnici sul contatore.
const P = [0, 2.8, 5.4, 8.2, 11.0, 13.6];
const S = [
  {lab:'MITO DA SFATARE', main:'Se cambio fornitore, resto senza luce?'},
  {lab:'TUTTI PENSANO CHE…', main:'«Cambio fornitore e resto al buio.»'},
  {lab:'INVECE', main:'La fornitura non si interrompe.', sub:'Lo spiega ARERA, l’Autorità per l’energia.'},
  {lab:'E IL CONTATORE?', main:'Resta lo stesso.', sub:'Nessun intervento tecnico in casa.'},
  {lab:'COSA CAMBIA ALLORA?', main:'Solo chi ti manda la bolletta.'},
  {lab:'VUOI CAMBIARE?', main:'Ti dico prima se ti conviene.'}
];
const DARK = '#060C18', RED = '#E5484D';
const phase = (t) => { for (let i = P.length - 1; i >= 0; i--) if (t >= P[i]) return i; return 0; };

function bigBulb(cx, cy, s, lit, q) {
  const fill = mix('#1A2A47', YEL, lit), cap = mix('#3A4C70', WH, lit);
  if (lit > 0.05) rays(cx, cy, 28 * s + 24, 40 * lit, 9, 160, 380, 12, YEL, lit);
  bulb(cx, cy, s, fill, cap, lit < 0.6 ? '#3A4C70' : null);
  if (q > 0) txt('?', cx, cy + 58, 160, 700, mix('#5B6B86', NAVY, lit), 'center', q);
}
function stamp(cx, cy, p) {
  if (p <= 0) return;
  const sc = lerp(1.8, 1, eo(p)), a = clamp(p * 2.5);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.rotate(-0.16); ctx.scale(sc, sc);
  ctx.strokeStyle = RED; ctx.lineWidth = 14; rr(-230, -80, 460, 160, 22); ctx.stroke();
  ctx.fillStyle = 'rgba(14,34,64,0.88)'; rr(-223, -73, 446, 146, 16); ctx.fill();
  txt('FALSO', 0, 46, 124, 700, RED, 'center');
  ctx.restore();
}
function meter(cx, cy, p, chk) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p; ctx.translate(cx, cy + (1 - eo(p)) * 60); ctx.scale(0.8, 0.8);
  ctx.fillStyle = '#F4F1E8'; rr(-230, -250, 460, 500, 40); ctx.fill();
  ctx.fillStyle = '#C9D2E0'; rr(-170, -200, 340, 40, 12); ctx.fill();
  ctx.fillStyle = NAVY; rr(-180, -120, 360, 130, 18); ctx.fill();
  txt('0 4 2 1 7', 0, -32, 76, 700, YEL, 'center');
  ctx.fillStyle = '#B9C3D3'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(-110 + k * 110, 110, 26, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#C9D2E0'; rr(-120, 180, 240, 24, 12); ctx.fill();
  ctx.restore();
  if (chk > 0) {
    const r = 70 * ebk(chk), x = cx + 190, y = cy + 175;
    ctx.save(); ctx.fillStyle = YEL; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = NAVY; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = clamp((chk - 0.3) / 0.4);
    ctx.beginPath(); ctx.moveTo(x - 32, y + 2); ctx.lineTo(x - 8, y + 28); ctx.lineTo(x + 36, y - 24); ctx.stroke(); ctx.restore();
  }
}
function env(x, y, rot, alpha, mine) {
  if (alpha <= 0) return;
  const w = 380, h = 250;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = mine ? '#F4F1E8' : '#C9D2E0'; rr(-w / 2, -h / 2, w, h, 22); ctx.fill();
  ctx.strokeStyle = mine ? '#B9B29E' : '#8E9AB0'; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-w / 2 + 8, -h / 2 + 14); ctx.lineTo(0, 24); ctx.lineTo(w / 2 - 8, -h / 2 + 14); ctx.stroke();
  if (!mine) { ctx.fillStyle = '#8E9AB0'; rr(-w / 2 + 34, h / 2 - 66, 150, 26, 13); ctx.fill(); }
  ctx.restore();
}
function textBlock(T, a1, a2, a3, rise) {
  txt(T.lab, 84, 1010, 44, 700, YEL, 'left', a1);
  const lines = wrap(T.main, 92, 700, 856);
  const z = Math.min(...lines.map(l => fit(l, 92, 700, 856)));
  lines.forEach((l, k) => txt(l, 84, 1116 + k * z * 1.14 + rise, z, 700, WH, 'left', a2));
  if (T.sub) txt(T.sub, 84, 1116 + lines.length * z * 1.14 - 14, fit(T.sub, 42, 500, 856), 500, SUB, 'left', a3);
}

window.render = function (t) {
  const i = phase(t), lt = t - P[i], nx = i < 5 ? P[i + 1] : 999;
  const out = i < 5 ? 1 - ei((t - (nx - 0.25)) / 0.25) : 1;
  let dark = 0;
  if (i === 1) dark = eo((lt - 0.5) / 0.35);
  if (i === 2) dark = 1 - eo((lt - 0.15) / 0.3);
  ctx.globalAlpha = 1; ctx.fillStyle = mix(NAVY, DARK, dark * 0.85); ctx.fillRect(0, 0, W, H);
  const on = [0, 1, 2, 3, 4].map(k => i === 0 ? eo((t - 0.15 - k * 0.1) / 0.25) : (1 - dark));
  wire(on, t, mix(YEL, '#2B3B5C', dark));

  const bob = 6 * Math.sin(2 * Math.PI * t / 2.4);
  if (i <= 2) {
    const fade = i === 2 ? 1 - eo((lt - 2.3) / 0.35) : 1;
    ctx.save(); ctx.globalAlpha = fade;
    const lit = i === 1 ? 1 - dark : (i === 2 ? 1 - dark : 1);
    const q = i === 2 ? 1 - eo((lt - 0.1) / 0.3) : 1;
    bigBulb(540, 690 + bob, 4.8, lit, q);
    ctx.restore();
    if (i === 2) stamp(540, 720, (lt - 0.35) / 0.35 * fade);
  }
  if (i === 3) meter(540, 715, eo(lt / 0.4) * out, (lt - 0.8) / 0.45);
  if (i === 4) {
    const qa = eo((lt - 0.2) / 0.6), qb = eo((lt - 0.7) / 0.6);
    env(lerp(540, -260, qa), 700 + bob, lerp(-0.05, -0.4, qa), 1 - qa * 0.9, false);
    env(lerp(1340, 540, qb), 740 + bob, lerp(0.4, 0.04, qb), qb * out, true);
    if (qb > 0.95) logo(395, 822 + bob, 40, NAVY, clamp((lt - 1.3) / 0.3) * out);
  }
  if (i === 5) {
    const pp = eo(lt / 0.5);
    rays(250, 620, 28 * 4.4 + 18, 30 * ebk((lt - 0.3) / 0.4), 7, 200, 340, 10, YEL, clamp((lt - 0.3) / 0.15));
    bulb(250, 620, 4.4, YEL, WH);
    logo(440, 636, 66, WH, pp);
    txt('Analisi gratuita della bolletta', 440, 710, fit('Analisi gratuita della bolletta', 40, 500, 560), 500, SUB, 'left', eo((lt - 0.2) / 0.4));
    txt(S[5].lab, 84, 900, 44, 700, YEL, 'left', eo(lt / 0.3));
    const z = fit(S[5].main, 92, 700, 856);
    const lines = wrap(S[5].main, 84, 700, 856);
    lines.forEach((l, k) => txt(l, 84, 1000 + k * 96 + (1 - eo((lt - 0.1) / 0.4)) * 40, 84, 700, WH, 'left', eo((lt - 0.1) / 0.4)));
    band(eo((lt - 0.7) / 0.55), 1164);
    return;
  }
  const T = S[i];
  const a1 = (i === 0 ? 1 : eo(lt / 0.3)) * out, a2 = (i === 0 ? 1 : eo((lt - 0.1) / 0.4)) * out, a3 = eo((lt - 0.5) / 0.4) * out;
  textBlock(T, a1, a2, a3, i === 0 ? 0 : (1 - eo((lt - 0.1) / 0.4)) * 40);
  logo(84, 1440, 40, mix(WH, '#5B6B86', dark), 1);
};
ready();
</script>
</body>
</html>
